<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0f7a5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TripSplit">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>TripSplit — Trip Expense Manager</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
:root{
 --bg:#f2f5f3;--card:#fff;--ink:#14201b;--muted:#7a8780;--line:#e7ede9;--chip:#f0f4f1;
 --brand:#0f7a5c;--brand2:#14a37a;--brandsoft:#e4f3ec;--green:#12905f;--red:#d2504f;--redsoft:#fdeeee;--amber:#e0a23b;
 --shadow:0 6px 24px rgba(20,40,30,.07);--nav:rgba(255,255,255,.92);
}
@media(prefers-color-scheme:dark){:root{
 --bg:#0e1512;--card:#17211c;--ink:#eaf2ed;--muted:#8b9a92;--line:#243029;--chip:#1e2a24;
 --brandsoft:#16352a;--redsoft:#3a1f1f;--shadow:0 6px 24px rgba(0,0,0,.35);--nav:rgba(23,33,28,.92);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
@media(min-width:560px){body{background:#dfe7e2}@media(prefers-color-scheme:dark){body{background:#070b09}}#app{box-shadow:0 0 60px rgba(0,0,0,.12);background:var(--bg)}}

/* top bar */
.appbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 18px 12px;background:var(--bg)}
.tripbtn{display:flex;align-items:center;gap:10px;text-align:left;max-width:75%}
.avatar{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font-size:19px;flex:none}
.tripbtn b{display:block;font-size:16px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tripbtn small{color:var(--muted);font-size:12px;display:block}
.iconbtn{width:40px;height:40px;border-radius:13px;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow);font-size:17px}

.screen{padding:4px 16px 0;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2.sec{font-size:17px;font-weight:800;letter-spacing:-.3px;margin:22px 4px 10px;display:flex;justify-content:space-between;align-items:center}
h2.sec a{font-size:13px;color:var(--brand);font-weight:700;text-decoration:none}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.card+.card{margin-top:12px}

/* hero */
.hero{background:linear-gradient(140deg,#0b5f47 0%,#0f7a5c 45%,#16a97d 100%);color:#fff;border-radius:26px;padding:22px 20px 20px;position:relative;overflow:hidden;box-shadow:0 14px 34px rgba(15,122,92,.32)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.hero:before{width:190px;height:190px;right:-60px;top:-70px}.hero:after{width:120px;height:120px;right:40px;bottom:-60px}
.hero .lbl{font-size:13px;opacity:.85;font-weight:600}
.hero .big{font-size:36px;font-weight:800;letter-spacing:-1.4px;margin:2px 0 14px}
.hbar{height:8px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden}
.hbar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .5s}
.hrow{display:flex;justify-content:space-between;margin-top:10px;font-size:12.5px;opacity:.92;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{background:var(--card);border-radius:18px;padding:13px 12px;box-shadow:var(--shadow)}
.stat small{color:var(--muted);font-size:11.5px;font-weight:600;display:block}
.stat b{font-size:16px;font-weight:800;letter-spacing:-.4px;display:block;margin-top:2px;white-space:nowrap}

/* list rows */
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.item:last-child{border-bottom:0}
.ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:21px;flex:none}
.item .mid{flex:1;min-width:0}
.item .mid b{display:block;font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .mid small{color:var(--muted);font-size:12px}
.item .amt{font-weight:800;font-size:15px;letter-spacing:-.3px;text-align:right;white-space:nowrap}
.item .amt small{display:block;font-weight:600;color:var(--muted);font-size:11px}
.pos{color:var(--green)}.neg{color:var(--red)}
.mav{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;flex:none}

/* donut */
.donutwrap{display:flex;align-items:center;gap:18px}
.donut{width:116px;height:116px;border-radius:50%;flex:none;display:grid;place-items:center}
.donut div{width:78px;height:78px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;font-size:11px;color:var(--muted);font-weight:600;line-height:1.2}
.donut b{display:block;font-size:14px;color:var(--ink);letter-spacing:-.4px}
.legend{flex:1;display:flex;flex-direction:column;gap:7px;font-size:12.5px;font-weight:600}
.legend span{display:flex;align-items:center;gap:7px}.legend i{width:9px;height:9px;border-radius:50%;flex:none}.legend em{margin-left:auto;font-style:normal;color:var(--muted)}

/* chips / filters */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:13px;color:var(--muted);transition:.15s}
.chip.on{background:var(--brand);color:#fff}
.sel{display:flex;flex-wrap:wrap;gap:8px}
.sel .chip{box-shadow:none;background:var(--chip)}
.sel .chip.on{background:var(--brand);color:#fff}

/* budget */
.brow{padding:12px 0;border-bottom:1px solid var(--line)}.brow:last-child{border:0}
.btop{display:flex;align-items:center;gap:10px}
.pbar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin-top:9px}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--brand2)}
.pbar i.over{background:var(--red)}

/* settle */
.settle{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}
.settle:last-child{border:0}
.settle .arrow{color:var(--muted);font-size:18px}
.settle .who{flex:1;font-weight:700;font-size:14px}
.settle .who small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.empty{text-align:center;padding:30px 16px;color:var(--muted);font-size:14px}
.empty .big{font-size:42px;margin-bottom:6px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:16px;background:var(--brand);color:#fff;font-weight:800;font-size:15px}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--chip);color:var(--ink)}
.btn.dng{background:var(--redsoft);color:var(--red)}
.btn.sm{padding:10px 14px;width:auto;font-size:13px;border-radius:12px}

/* bottom nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;z-index:30;background:var(--nav);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:10.5px;font-weight:700;padding:6px 0;border-radius:14px}
.nav button .ni{font-size:21px;line-height:1;filter:grayscale(1);opacity:.65;transition:.15s}
.nav button.on{color:var(--brand)}
.nav button.on .ni{filter:none;opacity:1;transform:translateY(-1px) scale(1.08)}
.fab{position:fixed;z-index:31;bottom:calc(84px + env(safe-area-inset-bottom));right:max(18px,calc(50% - 242px));width:58px;height:58px;border-radius:20px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:30px;font-weight:300;display:grid;place-items:center;box-shadow:0 10px 26px rgba(15,122,92,.45);line-height:1;transition:transform .15s}
.fab:active{transform:scale(.92)}

/* sheet */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,20,15,.5);opacity:0;pointer-events:none;transition:opacity .25s;display:flex;align-items:flex-end;justify-content:center}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:520px;max-height:92dvh;max-height:92vh;overflow-y:auto;background:var(--card);border-radius:28px 28px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.9,.3,1)}
.overlay.open .sheet{transform:none}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 14px}
.sheet h3{margin:0 0 16px;font-size:20px;font-weight:800;letter-spacing:-.5px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 2px 6px;letter-spacing:.2px}
.fld input,.fld select{width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-size:16px;outline:none;transition:.15s;appearance:none;-webkit-appearance:none}
.fld input:focus,.fld select:focus{border-color:var(--brand2);background:var(--card)}
.amountbox{text-align:center;margin:2px 0 16px}
.amountbox input{border:0;background:none;text-align:center;font-size:44px;font-weight:800;letter-spacing:-1.5px;width:100%;outline:none;color:var(--ink)}
.amountbox small{color:var(--muted);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#14201b;color:#fff;padding:11px 18px;border-radius:99px;font-weight:700;font-size:13px;opacity:0;transition:.25s;z-index:80;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.note{font-size:12px;color:var(--muted);margin:10px 4px 0;line-height:1.5}
.sub{color:var(--muted);font-size:12.5px}
.rowbtn{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;font-weight:700}
.rowbtn:last-child{border:0}
.rowbtn span:first-child{width:36px;height:36px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:18px}
.rowbtn small{display:block;color:var(--muted);font-weight:500;font-size:12px}
</style>
</head>
<body>
<div id="app">
 <header class="appbar">
  <button class="tripbtn" onclick="openTrips()"><div class="avatar">🧳</div><div style="min-width:0"><b id="tName">My trip</b><small id="tSub">Tap to switch trips ▾</small></div></button>
  <button class="iconbtn" onclick="openDeposit()" aria-label="Add deposit">💰</button>
 </header>
 <div id="view" class="screen"></div>
</div>
<button class="fab" id="fab" onclick="openExpense()" aria-label="Add expense">+</button>
<nav class="nav" id="nav">
 <button data-t="home" class="on"><span class="ni">🏠</span>Home</button>
 <button data-t="expenses"><span class="ni">🧾</span>Expenses</button>
 <button data-t="budget"><span class="ni">🎯</span>Budget</button>
 <button data-t="settle"><span class="ni">🤝</span>Settle</button>
 <button data-t="more"><span class="ni">⚙️</span>More</button>
</nav>
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- state ---------- */
const KEY='tripsplit_v2',OLD='tripsplit_v1',FUND='Trip fund';
const CATS={'Travel':['✈️','#e3eefe'],'Stay':['🏨','#f1e6fb'],'Food':['🍽️','#fff0dc'],'Local transport':['🚕','#fdf3c8'],'Activities':['🎟️','#fde6ee'],'Shopping':['🛍️','#e0f5f0'],'Other':['📦','#eceff1']};
const CCOL={'Travel':'#4f86e8','Stay':'#9a63d8','Food':'#f2994a','Local transport':'#e6c229','Activities':'#e86c92','Shopping':'#2bb5a0','Other':'#94a3ad'};
const AV=['#0f7a5c','#4f86e8','#9a63d8','#e86c92','#f2994a','#2bb5a0','#c0554f','#6b7fd7'];
const uid=()=>(crypto.randomUUID?crypto.randomUUID():'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8));
const newTrip=(name='My trip')=>({id:uid(),code:'',name,start:'',end:'',metaTs:0,members:[],mts:{},budgets:{},bts:{},expenses:[],deposits:[],del:{}});
function norm(t){t.del=t.del||{};t.mts=t.mts||{};t.bts=t.bts||{};t.code=t.code||'';t.metaTs=t.metaTs||0;t.members=t.members||[];t.budgets=t.budgets||{};t.expenses=t.expenses||[];t.deposits=t.deposits||[];return t}
function load(){
 try{const s=localStorage.getItem(KEY);if(s){const d=JSON.parse(s);if(d&&d.trips&&d.trips.length)return d}}catch(e){}
 try{const o=localStorage.getItem(OLD);if(o){const d=JSON.parse(o);const t=newTrip(d.trip&&d.trip.place||'My trip');t.start=d.trip?.start||'';t.end=d.trip?.end||'';t.members=d.members||[];t.budgets=d.budgets||{};t.expenses=d.expenses||[];t.deposits=d.deposits||[];return{current:t.id,trips:[t]}}}catch(e){}
 const t=newTrip();return{current:t.id,trips:[t]};
}
let S=load(),tab='home',filter='All';S.trips.forEach(norm);
const T=()=>S.trips.find(t=>t.id===S.current)||S.trips[0];
let rev=0,syncT=null;const syncState={},syncing={};
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('⚠️ Could not save — storage full or blocked')}}
function save(){persist();rev++;render();scheduleSync()}

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const short=n=>{n=Number(n||0);const a=Math.abs(n);return (n<0?'-':'')+'₹'+(a>=1e5?(a/1e5).toFixed(a%1e5?1:0)+'L':a>=1e4?(a/1e3).toFixed(a%1e3?1:0)+'k':a.toLocaleString('en-IN',{maximumFractionDigits:0}))};
const sum=a=>a.reduce((x,y)=>x+Number(y||0),0);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const fdate=s=>{if(!s)return'';const d=new Date(s+'T00:00:00');return isNaN(d)?s:d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})};
const ini=n=>(n||'?').trim().charAt(0).toUpperCase();
const avc=(t,n)=>AV[Math.max(0,t.members.indexOf(n))%AV.length];
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
function vib(){try{navigator.vibrate&&navigator.vibrate(10)}catch(e){}}

/* ---------- calculations ---------- */
function parts(t,e){const p=(e.split&&e.split.length?e.split:t.members).filter(m=>t.members.includes(m));return p.length?p:t.members}
function calc(t){
 const total=sum(t.expenses.map(e=>e.amount));
 const share={},paid={},dep={};
 t.members.forEach(m=>{share[m]=0;paid[m]=0;dep[m]=0});
 t.expenses.forEach(e=>{const p=parts(t,e);p.forEach(m=>share[m]+=e.amount/p.length);if(paid[e.payer]!==undefined)paid[e.payer]+=e.amount});
 t.deposits.forEach(d=>{if(dep[d.member]!==undefined)dep[d.member]+=d.amount});
 const fundPaid=sum(t.expenses.filter(e=>e.payer===FUND).map(e=>e.amount));
 const deposits=sum(t.deposits.map(d=>d.amount));
 const net={};t.members.forEach(m=>net[m]=dep[m]+paid[m]-share[m]);
 const fundNet=fundPaid-deposits; // negative => fund still holds cash
 return{total,share,paid,dep,net,fundPaid,deposits,fundNet,fundLeft:deposits-fundPaid};
}
function settlements(t,c){
 const nodes=t.members.map(m=>({n:m,a:c.net[m]}));
 if(c.deposits>0||c.fundPaid>0)nodes.push({n:FUND,a:c.fundNet});
 const cr=nodes.filter(x=>x.a>.5).map(x=>({...x})).sort((a,b)=>b.a-a.a),db=nodes.filter(x=>x.a<-.5).map(x=>({n:x.n,a:-x.a})).sort((a,b)=>b.a-a.a),out=[];
 let i=0,j=0;while(i<db.length&&j<cr.length){const v=Math.min(db[i].a,cr[j].a);out.push({from:db[i].n,to:cr[j].n,amt:v});db[i].a-=v;cr[j].a-=v;if(db[i].a<.5)i++;if(cr[j].a<.5)j++}
 return out;
}
function tripDays(t){if(!t.start||!t.end)return 0;const d=(new Date(t.end)-new Date(t.start))/864e5+1;return d>0?Math.round(d):0}

/* ---------- screens ---------- */
function expRow(t,e,withSplit=true){
 const [ic,bg]=CATS[e.category]||CATS.Other,p=parts(t,e);
 return `<button class="item" onclick="openExpense('${e.id}')"><div class="ic" style="background:${bg}">${ic}</div><div class="mid"><b>${esc(e.title)}</b><small>${fdate(e.date)} · ${esc(e.payer)} paid${withSplit&&p.length!==t.members.length?` · ${p.length} sharing`:''}</small></div><div class="amt">${money(e.amount)}</div></button>`;
}
function noMembersCard(){return `<div class="card empty"><div class="big">👥</div><b style="color:var(--ink)">Add your travel buddies first</b><div style="margin:6px 0 16px">Expenses are split between trip members.</div><button class="btn" onclick="openMember()">Add members</button></div>`}

function vHome(t,c){
 const budget=sum(Object.values(t.budgets)),rem=budget-c.total,pct=budget?Math.min(100,c.total/budget*100):0;
 const d=tripDays(t);
 let h=`<div class="hero"><div class="lbl">Total spent</div><div class="big">${money(c.total)}</div>
  ${budget?`<div class="hbar"><i style="width:${pct}%"></i></div><div class="hrow"><span>${Math.round(pct)}% of ${short(budget)}</span><span>${rem>=0?short(rem)+' left':short(-rem)+' over'}</span></div>`:`<div class="hrow" style="margin-top:0"><span>No budget set yet — add one in the Budget tab</span></div>`}</div>
 <div class="stats"><div class="stat"><small>Per person</small><b>${short(t.members.length?c.total/t.members.length:0)}</b></div><div class="stat"><small>Members</small><b>${t.members.length}</b></div><div class="stat"><small>${d?'Per day':'Expenses'}</small><b>${d?short(c.total/d):t.expenses.length}</b></div></div>`;
 if(!t.members.length)return h+`<div style="margin-top:14px">${noMembersCard()}</div>`;
 // donut
 const cat=Object.keys(CATS).map(k=>[k,sum(t.expenses.filter(e=>e.category===k).map(e=>e.amount))]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
 if(cat.length){let acc=0;const grad=cat.map(([k,v])=>{const s=acc/c.total*100;acc+=v;return `${CCOL[k]} ${s}% ${acc/c.total*100}%`}).join(',');
  h+=`<h2 class="sec">Where the money went</h2><div class="card"><div class="donutwrap"><div class="donut" style="background:conic-gradient(${grad})"><div><span><b>${short(c.total)}</b>total</span></div></div><div class="legend">${cat.slice(0,6).map(([k,v])=>`<span><i style="background:${CCOL[k]}"></i>${k}<em>${Math.round(v/c.total*100)}%</em></span>`).join('')}</div></div></div>`}
 // recent
 h+=`<h2 class="sec">Recent expenses${t.expenses.length>5?`<a href="#" onclick="go('expenses');return false">See all</a>`:''}</h2><div class="card" style="padding:4px 16px">`+(t.expenses.length?t.expenses.slice(-5).reverse().map(e=>expRow(t,e)).join(''):`<div class="empty"><div class="big">🧾</div>No expenses yet.<br>Tap <b>+</b> to add your first one.</div>`)+`</div>`;
 // balances

/* ---------- cloud sync ---------- */
function updateSub(){
 const t=T(),st=syncState[t.id];
 $('tSub').textContent=(t.start?fdate(t.start)+(t.end?' – '+fdate(t.end):'')+' · ':'')+t.members.length+' member'+(t.members.length===1?'':'s')+
  (t.code?(st==='busy'?' · syncing…':st==='err'?' · ⚠️ offline':st==='cfg'?' · ⚠️ not set up':' · ☁️ synced'):'')+' ▾';

// Keep in sync with merge() in api/trip.js
function mergeTrips(a,b){
 const r={id:a.id,code:a.code||b.code};
 const m=(b.metaTs||0)>(a.metaTs||0)?b:a;r.name=m.name;r.start=m.start;r.end=m.end;r.metaTs=m.metaTs||0;
 r.del={...(a.del||{})};for(const k in (b.del||{}))r.del[k]=Math.max(r.del[k]||0,b.del[k]);
 const alive=(k,ts)=>!(k in r.del)||r.del[k]<(ts||0);
 const recs=(la,lb,p)=>{const map=new Map();for(const x of [...(la||[]),...(lb||[])]){const c=map.get(x.id);if(!c||(x.ts||0)>(c.ts||0))map.set(x.id,x)}return[...map.values()].filter(x=>alive(p+x.id,x.ts))};
 r.expenses=recs(a.expenses,b.expenses,'e:');r.deposits=recs(a.deposits,b.deposits,'d:');
 r.mts={...(a.mts||{})};for(const k in (b.mts||{}))r.mts[k]=Math.max(r.mts[k]||0,b.mts[k]);
 const names=[...(a.members||[])];for(const n of (b.members||[]))if(!names.includes(n))names.push(n);
 r.members=names.filter(n=>alive('m:'+n,r.mts[n]||1));
 r.budgets={};r.bts={};
 const keys=new Set([...Object.keys(a.budgets||{}),...Object.keys(b.budgets||{}),...Object.keys(a.bts||{}),...Object.keys(b.bts||{})]);
 for(const k of keys){const ta=(a.bts||{})[k]||0,tb=(b.bts||{})[k]||0;const src=tb>ta?b:ta>tb?a:(k in (a.budgets||{}))?a:b;
  if(src.budgets&&k in src.budgets)r.budgets[k]=src.budgets[k];if(Math.max(ta,tb))r.bts[k]=Math.max(ta,tb)}
 return r;
}
function scheduleSync(){clearTimeout(syncT);syncT=setTimeout(()=>syncNow(T()),700)}
async function syncNow(t){
 if(!t||!t.code||syncing[t.id])return;
 syncing[t.id]=true;setStatus(t,'busy');const r0=rev,before=JSON.stringify(t);
 try{
  const res=await fetch('/api/trip',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:t.code,trip:t})});
  if(res.status===503){setStatus(t,'cfg');return}
  if(!res.ok)throw new Error(res.status);
  const {trip}=await res.json();
  Object.assign(t,mergeTrips(t,norm(trip)));persist();setStatus(t,'ok');
  if(JSON.stringify(t)!==before&&!$('overlay').classList.contains('open'))render();
  if(rev!==r0)scheduleSync();
 }catch(e){setStatus(t,'err')}finally{syncing[t.id]=false}
}
function genCode(){const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789',b=new Uint8Array(8);crypto.getRandomValues(b);return[...b].map(x=>A[x%A.length]).join('')}
function enableSync(){const t=T();t.code=genCode();persist();render();syncNow(t);toast('Sync turned on')}
function stopSync(){if(!confirm('Stop syncing on this device? Your data stays here and online; you can rejoin with the code.'))return;T().code='';persist();render()}
function inviteLink(t){return location.origin+location.pathname+'?join='+t.code}
async function shareTrip(){const t=T(),text=`Join "${t.name}" on TripSplit — code ${t.code}`;
 try{if(navigator.share){await navigator.share({title:'TripSplit',text,url:inviteLink(t)});return}}catch(e){return}
 try{await navigator.clipboard.writeText(text+'\n'+inviteLink(t));toast('Invite link copied')}catch(e){toast('Code: '+t.code)}}
async function copyCode(){try{await navigator.clipboard.writeText(T().code);toast('Code copied')}catch(e){toast('Code: '+T().code)}}
function openJoin(){sheet(`<h3>Join a trip</h3><div class="fld"><label>TRIP CODE</label><input id="jCode" placeholder="8-character code" maxlength="8" autocapitalize="characters" autocomplete="off" style="text-align:center;font-size:24px;font-weight:800;letter-spacing:4px;text-transform:uppercase"></div><button class="btn" onclick="joinTrip($('jCode').value)">Join trip</button><div class="note">Ask the trip creator for the code, or open the invite link they share.</div>`);setTimeout(()=>$('jCode').focus(),320)}
async function joinTrip(code){
 code=String(code||'').trim().toUpperCase();
 if(!/^[A-Z2-9]{8}$/.test(code))return toast('Enter the 8-character code');
 const ex=S.trips.find(t=>t.code===code);if(ex){S.current=ex.id;closeSheet();save();go('home');syncNow(ex);return toast('You already have this trip')}
 try{
  const res=await fetch('/api/trip?code='+code);
  if(res.status===404)return toast('Code not found');
  if(res.status===503)return toast('Cloud storage not set up yet');
  if(!res.ok)throw 0;
  const {trip}=await res.json();const t=norm(trip);t.id=uid();t.code=code;
  S.trips.push(t);S.current=t.id;closeSheet();save();go('home');toast('Joined '+t.name);
 }catch(e){toast('Could not join — check your connection')}
}
function cloudCard(t){
 const st=syncState[t.id];
 if(t.code)return `<h2 class="sec" style="margin-top:6px">Cloud sync</h2><div class="card"><div style="display:flex;align-items:center;gap:12px"><div class="ic" style="background:var(--brandsoft)">☁️</div><div style="flex:1"><b>${st==='cfg'?'Cloud storage not set up':st==='err'?'Offline — will retry':st==='busy'?'Syncing…':'Synced across devices'}</b><div class="sub">Trip code</div></div></div><div style="font-size:28px;font-weight:800;letter-spacing:4px;text-align:center;margin:14px 0">${t.code}</div><div class="two"><button class="btn sm" onclick="shareTrip()">Share invite</button><button class="btn sec sm" onclick="copyCode()">Copy code</button></div><div class="note">Anyone with this code can view and edit this trip.</div><div style="margin-top:8px"><button class="btn sec sm" style="width:100%" onclick="stopSync()">Stop syncing on this device</button></div></div>`;
 return `<h2 class="sec" style="margin-top:6px">Cloud sync</h2><div class="card"><div style="display:flex;align-items:center;gap:12px"><div class="ic" style="background:var(--brandsoft)">☁️</div><div style="flex:1"><b>Access from anywhere</b><div class="sub">Back up this trip online and share it with friends</div></div></div><div style="margin-top:14px"><button class="btn" onclick="enableSync()">Turn on sync</button></div><div style="margin-top:10px"><button class="btn sec" onclick="openJoin()">Join a trip with a code</button></div></div>`;
}
setInterval(()=>{if(!document.hidden)syncNow(T())},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow(T())});
window.addEventListener('online',()=>syncNow(T()));

/* ---------- init ---------- */
render();syncNow(T());
(function(){const p=new URLSearchParams(location.search).get('join');if(p){history.replaceState(null,'',location.pathname);setTimeout(()=>joinTrip(p),400)}})();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
</body>
